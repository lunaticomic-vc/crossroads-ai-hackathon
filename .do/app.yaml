name: word-crossroads
services:
- environment_slug: node-js
  github:
    branch: main
    deploy_on_push: true
    repo: lunaticomic-vc/crossroads-ai-hackathon
  name: word-crossroads-api
  run_command: npm start
  source_dir: /
  http_port: 3000
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: NODE_ENV
    value: production
  - key: OPENAI_API_KEY
    value: ${OPENAI_API_KEY}
  - key: GOOGLE_CLIENT_ID
    value: ${GOOGLE_CLIENT_ID}
  - key: GOOGLE_CLIENT_SECRET
    value: ${GOOGLE_CLIENT_SECRET}
  - key: SESSION_SECRET
    value: ${SESSION_SECRET}
